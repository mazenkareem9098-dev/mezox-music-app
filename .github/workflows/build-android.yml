name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mezox_api:
        description: 'MEZOX_API server URL (e.g. https://mezox-music-api.onrender.com)'
        required: true
        default: 'http://10.0.2.2:3000'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate platform scaffolding (if needed)
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name mezox_music --org com.mezox .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=MEZOX_API=${{ github.event.inputs.mezox_api }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZOX-MUSIC-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
