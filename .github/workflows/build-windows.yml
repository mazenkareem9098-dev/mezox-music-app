name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mezox_relay:
        description: 'Public MQTT relay host (default: broker.hivemq.com)'
        required: false
        default: 'broker.hivemq.com'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build release Windows
        run: flutter build windows --release --dart-define=MEZOX_API=${{ github.event.inputs.mezox_relay || 'broker.hivemq.com' }}
      - name: Upload Windows release folder
        uses: actions/upload-artifact@v4
        with:
          name: MEZOX-MUSIC-windows-release
          path: build/windows/x64/runner/Release/
