name: mezox_music
description: MEZOX MUSIC - YouTube, no ads, serverless listen together
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  mqtt_client: ^10.14.0
  just_audio: ^0.9.40
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  youtube_explode_dart: ^3.1.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
